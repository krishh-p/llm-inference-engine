[workspace]
members = [
    "crates/cuda-backend",
    "crates/cuda-kernels",
    "crates/engine-core",
    "crates/model-qwen3",
    "crates/qwen3-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
cuda-core = "=0.4.0"
cutile = "=0.4.0"
memmap2 = "=0.9.11"
safetensors = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.1", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# fallible operations are documented once on the type, not on every method
missing_errors_doc = "allow"
