[workspace]
members = [
    "crates/engine-core",
    "crates/model-qwen3",
    "crates/qwen3-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
memmap2 = "=0.9.11"
safetensors = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.1", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
